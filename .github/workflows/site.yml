# Tests and builds the reference site in site/; pushes to main publish it to Cloudflare Pages.
# One-time setup: repository secrets CLOUDFLARE_API_TOKEN (permission: Account → Cloudflare Pages → Edit)
# and CLOUDFLARE_ACCOUNT_ID. The Pages project is created on the first run.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      PROJECT: privacy-for-builders
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
